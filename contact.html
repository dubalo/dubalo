    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        h2 { color: #3498db; margin-top: 30px; }
        nav { margin-bottom: 20px; }
        nav a { text-decoration: none; color: #3498db; font-weight: bold; }

<body>
    <nav><a href="index.html">← Back to Home</a></nav>
    <div class="card">
        <h1>Contact Us</h1>
        <p>If you have any questions, suggestions, or need assistance, please reach out to us using the form below.</p>
        
        <form action="https://formspree.io/f/mnjbrwzg" method="POST">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            
            <button type="submit">Send Message</button>
        </form>
    </div>
